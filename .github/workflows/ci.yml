name: Synthetic prototype checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m ml.simulate --n 6000 --seed 42
      - run: python -m ml.train --seed 42
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
