name: Real-data research code and public-release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_real_nhanes.py tests/test_public_aggregate.py
      - name: Check public provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          public = Path('web/public/data')
          assert sorted(x.name for x in public.glob('*.json')) == ['nhanes-aggregate.json']
          data=json.loads((public/'nhanes-aggregate.json').read_text())
          assert data['provenance']=='REAL_NHANES_AGGREGATE_ONLY'
          assert 'cases' not in data and 'patients' not in data
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
