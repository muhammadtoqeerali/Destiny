name: NHANES research and release safety
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "optuna>=4.4,<5"
      - run: python -m pytest -q tests/test_real_nhanes.py tests/test_public_aggregate.py tests/test_nhanes_refinement.py tests/test_v08.py tests/test_phq_xport_zero.py tests/test_survival_v09.py tests/test_nhats_v09.py tests/test_case_engine_v10.py tests/test_case_forensics_v11.py tests/test_case_model_io_v11.py tests/test_clean_model_reload_v112.py tests/test_decision_quality_v12.py tests/test_case_strategy_v13.py tests/test_case_ablation_v14.py tests/test_preprocess_selection_v15.py tests/test_case_joint_selection_v16.py tests/test_case_stability_v17.py tests/test_case_reliability_v18.py tests/test_case_readiness_v19.py tests/test_case_source_semantics_v21.py tests/test_case_governance_v22.py tests/test_case_dictionary_timing_v23.py tests/test_case_harmonization_v24.py tests/test_case_foldsafe_v25.py tests/test_case_task_models_v26.py tests/test_case_temporal_v27.py tests/test_case_reliability_v28.py tests/test_case_workflow_v29.py tests/test_case_integrity_v30.py tests/test_web_reporting_v31.py tests/test_demo_studio_v32.py tests/test_engine_studio_v33.py tests/test_demo_qa_v34.py tests/test_doctor_v35.py tests/test_doctor_journey_v36.py tests/test_runtime_gate_v37.py tests/test_platform_v38.py tests/test_inference_readiness_v39.py tests/test_serving_v40.py tests/test_validation_v41.py
      - name: Verify documentary inference readiness
        run: PYTHONPATH=. python -m ml.inference_readiness_v39 --check
      - name: Verify v0.46 public research activation plan
        run: PYTHONPATH=. python -m ml.study_activation_v46 --check-public-plan
      - name: Validate v0.46 private-only planning contracts
        run: python -m pytest -q tests/test_study_activation_v46.py
      - name: Check v0.47 generated interview benchmark
        run: PYTHONPATH=. python -m ml.interview_benchmark_v47 --check
      - name: Validate v0.47 interview research focus
        run: python -m pytest -q tests/test_interview_focus_v47.py
      - name: Validate v0.45 local-only evidence triage source contracts
        run: python -m pytest -q tests/test_study_evidence_triage_v45.py
      - name: Verify v0.45 unmodified blank study-team template
        run: PYTHONPATH=. python -m ml.study_evidence_triage_v45 --check-template
      - name: Verify v0.44 public-only study-team evidence handoff
        run: PYTHONPATH=. python -m ml.study_handoff_v44 --check
      - name: Validate v0.44 study-team handoff regressions
        run: python -m pytest -q tests/test_handoff_v44.py
      - name: Verify v0.43 synthetic-only model-artifact manifest
        run: PYTHONPATH=. python -m ml.artifact_acceptance_v43 --check
      - name: Validate v0.43 artifact acceptance regression contracts
        run: python -m pytest -q tests/test_artifact_v43.py
      - name: Verify v0.42 public source-to-form crosswalk
        run: PYTHONPATH=. python -m ml.model_translation_v42 --check
      - name: Validate v0.42 source-to-form regression contracts
        run: python -m pytest -q tests/test_translation_v42.py
      - name: Verify v0.41 public research and invented holdback receipt
        run: PYTHONPATH=. python -m ml.research_validation_v41 --check
      - name: Public payload validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data_dir=Path('web/public/data')
          expected={'nhanes-aggregate.json','nhanes-refinement.json','nhanes-cohort-profile.json','nhanes-case-audit-v11.json','nhanes-decision-quality-v12.json'}
          files={x.name for x in data_dir.iterdir() if x.is_file()}
          assert files==expected,(files, expected)
          forbidden={'SEQN','patient','patients','cases','caseId','raw_predictions','individual_scores','date_of_birth'}
          for fname in sorted(files):
              obj=json.loads((data_dir/fname).read_text())
              assert obj['provenance']=='REAL_NHANES_AGGREGATE_ONLY'
              assert not (forbidden & set(obj.keys()))
              if fname=='nhanes-cohort-profile.json':
                  assert len(obj['groups'])>=1
                  assert all(g['n']>=50 for g in obj['groups'])
                  assert all(v['n_observed']>=50 for g in obj['groups'] for v in g['conditions']+g['mobility'])
              elif fname=='nhanes-case-audit-v11.json':
                  assert obj['schema']=='FRAILTYSCOPE_PUBLIC_CASE_AUDIT_V11'
                  assert obj['counts']['all']==2422
                  assert obj['counts']['evaluation']==1257
                  assert 'local_examples' not in obj
                  assert all(x['n']>=50 for x in obj['evaluation']['calibration'])
                  assert all(x['n']>=100 for x in obj['evaluation']['subgroups'])
              elif fname=='nhanes-decision-quality-v12.json':
                  assert obj['schema']=='FRAILTYSCOPE_PUBLIC_DECISION_QUALITY_V12'
                  assert obj['counts']=={'validation':292,'evaluation':1257,'events':246}
                  assert len(obj['thresholds'])==14
                  assert all(x['n']>=100 and min(x['events'],x['n']-x['events'])>=20 for x in obj['subgroups'])
                  assert all(x['n']>=50 and min(x['events'],x['n']-x['events'])>=10 for x in obj['calibration_bands'])
              else:
                  assert obj['counts']['total']>=2000
          print('PASS: Only validated real NHANES aggregate exports')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      # Actual Chromium browser checks against a freshly built local Next.js server.
      # This is independent of the synthetic/privacy Python regression suite.
      - run: python -m pip install 'playwright==1.56.0'
      - name: Verify preinstalled GitHub runner Chrome
        run: test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version
      - run: bash scripts/run_browser_qa_v34.sh
        env:
          FRAILTYSCOPE_QA_PYTHON: python
          FRAILTYSCOPE_QA_CHROMIUM: /usr/bin/google-chrome
