name: NHANES research and release safety
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_real_nhanes.py tests/test_public_aggregate.py tests/test_nhanes_refinement.py tests/test_v08.py tests/test_phq_xport_zero.py
      - name: Public payload validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data_dir=Path('web/public/data')
          expected={'nhanes-aggregate.json','nhanes-refinement.json','nhanes-cohort-profile.json'}
          files={x.name for x in data_dir.iterdir() if x.is_file()}
          assert files==expected,(files, expected)
          forbidden={'SEQN','patient','patients','cases','caseId','raw_predictions','individual_scores','date_of_birth'}
          for fname in sorted(files):
              obj=json.loads((data_dir/fname).read_text())
              assert obj['provenance']=='REAL_NHANES_AGGREGATE_ONLY'
              assert not (forbidden & set(obj.keys()))
              if fname=='nhanes-cohort-profile.json':
                  assert len(obj['groups'])>=1
                  assert all(g['n']>=50 for g in obj['groups'])
                  assert all(v['n_observed']>=50 for g in obj['groups'] for v in g['conditions']+g['mobility'])
              else:
                  assert obj['counts']['total']>=2000
          print('PASS: Only validated real NHANES aggregate exports')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
